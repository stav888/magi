<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGI//ARCHIVE | Discovered repositories from the open source frontier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --eva-purple-deep: #000000;
      --eva-purple: #0a0a0a;
      --eva-purple-light: #1a1a1a;
      --eva-orange: #ff6611;
      --eva-orange-glow: rgba(255, 102, 17, 0.7);
      --eva-cyan: #00ffff;
      --eva-green: #00ff41;
      --eva-red: #ff0040;
      --eva-text: #e0d4f0;
      --eva-text-dim: #9080a8;
      --accent: var(--eva-orange);
      --accent-2: var(--eva-green);
      --gap: 12px;
      --radius: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto Mono', monospace;
      line-height: 1.6;
      background: #000;
      color: var(--eva-text);
      min-height: 100vh;
    }

    a {
      color: var(--eva-orange);
      text-decoration: none;
      transition: color .2s, border-color .2s;
    }
    a:hover {
      color: var(--eva-green);
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
    }

    /* ===== MICRO HEADER (matches real site) ===== */
    .micro-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.92);
      border-bottom: 1px solid var(--eva-purple-light);
      backdrop-filter: blur(8px);
    }

    .micro-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--eva-orange);
      text-shadow: 0 0 10px #ff6611, 0 0 20px rgba(255,102,17,0.5);
      text-decoration: none;
      white-space: nowrap;
    }
    .micro-title:hover {
      color: var(--eva-green);
      text-shadow: 0 0 10px #00ff41;
    }

    .status-indicator {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: var(--eva-green);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.08em;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--eva-green);
      box-shadow: 0 0 8px var(--eva-green);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .search-wrap {
      flex: 1 1 280px;
      max-width: 420px;
      position: relative;
    }
    #site-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--eva-orange);
      background: #000;
      color: var(--eva-text);
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(255,102,17,0.3);
      outline: none;
    }
    #site-search::placeholder { color: var(--eva-text-dim); opacity: 0.7; }
    #site-search:focus {
      border-color: var(--eva-green);
      box-shadow: 0 0 20px #00ff41, 0 0 40px rgba(0,255,65,0.35);
    }

    .entry-count {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: var(--eva-text-dim);
      letter-spacing: 0.06em;
    }

    .github-project {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--eva-orange);
      border: 1px solid var(--eva-orange);
      padding: 4px 10px;
      transition: all .2s;
    }
    .github-project:hover {
      background: var(--eva-orange);
      color: #000;
      box-shadow: 0 0 15px var(--eva-orange-glow);
      text-shadow: none;
    }

    /* ===== MAIN CONTENT ===== */
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      color: var(--eva-green);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .page-desc {
      color: var(--eva-text-dim);
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* Feed: 2 cards side by side */
    #feed {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      #feed {
        grid-template-columns: 1fr;
      }
    }

    /* ===== POST CARDS (matches real site as closely as possible) ===== */
    .post {
      background:
        linear-gradient(110deg, transparent 0%, rgba(255,102,17,0.22) 50%, transparent 100%) -120% 0 / 200% 100% no-repeat,
        linear-gradient(135deg, var(--eva-purple), var(--eva-purple-deep));
      border: 1px solid var(--eva-orange);
      border-left: 3px solid var(--eva-orange);
      padding: calc(var(--gap) - 2px) var(--gap);
      margin: 0;
      position: relative;
      transition: transform .2s, box-shadow .2s, background-position 1.1s ease-out, border-color .2s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      box-shadow: 0 0 20px rgba(255,102,17,0.35);
      cursor: pointer;
    }

    .post:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 30px #ff6611, 0 0 60px rgba(255,102,17,0.5), 0 0 100px rgba(0,255,65,0.2);
      border-color: var(--eva-green);
      background-position: 120% 0, 0 0;
    }

    .post:hover .rec-indicator { color: var(--eva-green); }

    .rec-indicator {
      position: absolute;
      top: 6px;
      right: 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      color: var(--eva-red);
      letter-spacing: 0.1em;
      z-index: 2;
    }

    .post-meta {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: var(--eva-green);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .post-meta::before {
      content: "//";
      color: var(--eva-orange);
      margin-right: 6px;
    }

    .post-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--eva-text);
      margin: 4px 0 8px;
      line-height: 1.3;
    }

    .post p {
      max-width: 72ch;
      font-size: 13px;
      color: var(--eva-text);
      margin-bottom: 10px;
    }

    .post-image-link {
      display: block;
      margin: 10px 0;
    }
    .post-image-link img {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid var(--eva-purple-light);
      transition: transform .2s, box-shadow .2s;
    }
    .post:hover .post-image-link img {
      box-shadow: 0 0 12px var(--eva-orange-glow);
    }

    .post-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--eva-purple-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .post-cta {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--eva-orange);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
      transition: opacity .2s, color .2s;
    }
    .post:hover .post-cta {
      opacity: 1;
      color: var(--eva-green);
    }

    .post-map-link {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--eva-text-dim);
      border-bottom: 1px dotted rgba(255,102,17,0.65);
    }
    .post-map-link:hover {
      color: var(--eva-orange);
      border-bottom-color: var(--eva-orange);
      text-shadow: none;
    }

    /* GitHub button (requested: link of the repo on the side) */
    .gh-link {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: var(--eva-orange);
      border: 1px solid rgba(255,102,17,0.5);
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .2s;
      white-space: nowrap;
    }
    .gh-link:hover {
      background: rgba(255,102,17,0.15);
      border-color: var(--eva-orange);
      color: var(--eva-green);
      text-shadow: none;
      box-shadow: 0 0 10px rgba(255,102,17,0.3);
    }
    .gh-link svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* ===== DETAIL VIEW ===== */
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .feed-view.hidden { display: none; }

    .back-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--eva-text-dim);
      background: transparent;
      border: 1px solid var(--eva-purple-light);
      padding: 6px 12px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all .2s;
    }
    .back-btn:hover {
      color: var(--eva-orange);
      border-color: var(--eva-orange);
    }

    .detail-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--eva-orange);
      text-shadow: 0 0 10px #ff6611, 0 0 20px rgba(255,102,17,0.4);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .detail-title a { color: inherit; }
    .detail-title a:hover { color: var(--eva-green); }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .detail-content {
      margin-bottom: 32px;
    }
    .detail-content img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--eva-purple-light);
      margin-bottom: 16px;
      display: block;
    }
    .detail-content p {
      margin-bottom: 12px;
      max-width: 72ch;
    }
    .detail-content h1 { display: none; }

    .related-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--eva-purple-light);
    }
    .related-section h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--eva-green);
      margin-bottom: 16px;
    }
    .related-section h3::before {
      content: "// ";
      color: var(--eva-orange);
    }

    /* Vertical list – continuation style, with preview + GitHub */
    .related-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .related-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 0;
      border-bottom: 1px solid var(--eva-purple-light);
      transition: background .15s;
    }
    .related-item:last-child {
      border-bottom: none;
    }
    .related-item:hover {
      background: rgba(255, 102, 17, 0.04);
    }

    .related-item .related-preview {
      display: block;
      width: auto;
      max-width: 687px;
      max-height: 870px;
      height: auto;
      object-fit: contain;
      border: 1px solid var(--eva-purple-light);
      background: #0a0a0a;
    }

    .related-item .related-body {
      width: 100%;
    }

    .related-item a.related-main {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .related-item .related-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--eva-orange);
      margin-bottom: 4px;
    }
    .related-item:hover .related-title {
      color: var(--eva-green);
      text-shadow: 0 0 8px rgba(0,255,65,0.4);
    }

    .related-item .related-snippet {
      font-size: 13px;
      color: var(--eva-text);
      line-height: 1.5;
      margin-bottom: 8px;
      max-width: 72ch;
    }

    .related-item .related-meta {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: var(--eva-text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .related-item .related-meta a {
      color: var(--eva-text-dim);
      border-bottom: 1px dotted rgba(255,102,17,0.4);
    }
    .related-item .related-meta a:hover {
      color: var(--eva-orange);
      border-bottom-color: var(--eva-orange);
      text-shadow: none;
    }
    .related-item .related-meta .gh-link {
      font-size: 11px;
      padding: 2px 7px;
    }

    /* Loading / Load more */
    .loading {
      text-align: center;
      padding: 40px 16px;
      color: var(--eva-text-dim);
      font-size: 13px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--eva-purple-light);
      border-top-color: var(--eva-orange);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--eva-orange);
      color: var(--eva-orange);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
    }
    .load-more:hover {
      background: var(--eva-orange);
      color: #000;
      box-shadow: 0 0 20px var(--eva-orange-glow);
    }

    .error {
      color: var(--eva-red);
      border: 1px solid rgba(255,0,64,0.4);
      background: rgba(255,0,64,0.08);
      padding: 12px;
      font-size: 13px;
    }

    /* Footer */
    .nerv-footer {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: var(--eva-orange);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: center;
    }
    .site-footer {
      text-align: center;
      padding: 24px 16px;
      border-top: 1px solid var(--eva-purple-light);
      font-size: 12px;
      color: var(--eva-text-dim);
    }
    .site-footer a { color: var(--eva-orange); }

    @media (max-width: 600px) {
      .micro-header { padding: 8px 12px; }
      .post { margin: 10px 0; }
      .wrapper { padding: 12px 10px 40px; }
    }
  </style>
</head>
<body>
  <header class="micro-header">
    <a class="micro-title" href="#" id="home-link">[ MAGI//ARCHIVE ]</a>
    <span class="status-indicator"><span class="status-dot"></span>SYSTEM ACTIVE</span>
    <div class="search-wrap">
      <input id="site-search" type="search" placeholder="Search repos…" autocomplete="off" aria-label="Search repositories">
    </div>
    <span class="entry-count" id="entry-count">— entries</span>
    <a class="github-project" href="https://github.com/tom-doerr/repo_posts" target="_blank" rel="noopener">View Project on GitHub</a>
  </header>

  <div class="wrapper">
    <!-- FEED VIEW -->
    <div class="feed-view" id="feed-view">
      <div class="tagline">// SURVEILLANCE FEED</div>
      <p class="page-desc">Discovered repositories from the open source frontier</p>

      <div id="feed"></div>
      <button class="load-more" id="load-more" style="display:none">Load more entries</button>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        Initializing surveillance feed…
      </div>
    </div>

    <!-- DETAIL VIEW -->
    <div class="detail-view" id="detail-view">
      <button class="back-btn" id="back-btn">← Back to feed</button>
      <h1 class="detail-title" id="detail-title"></h1>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-content" id="detail-content"></div>
      <div class="related-section">
        <h3>Related repos</h3>
        <ul class="related-list" id="related-grid"></ul>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="nerv-footer">NERV // OPEN SOURCE DIVISION</p>
    <p>Data from <a href="https://tom-doerr.github.io/repo_posts/" target="_blank" rel="noopener">MAGI//ARCHIVE</a> · Not affiliated</p>
  </footer>

  <script>
    const FEED_URL = 'https://tom-doerr.github.io/repo_posts/feed.xml';
    const BASE = 'https://tom-doerr.github.io';
    const PAGE_SIZE = 30;

    let allEntries = [];
    let visibleCount = 0;
    let currentFilter = '';
    let detailToken = 0; // prevents race when navigating related → related
    let entryByPath = new Map(); // path → entry, for reliable related navigation

    const feedEl = document.getElementById('feed');
    const loadingEl = document.getElementById('loading');
    const loadMoreBtn = document.getElementById('load-more');
    const searchEl = document.getElementById('site-search');
    const entryCountEl = document.getElementById('entry-count');
    const feedView = document.getElementById('feed-view');
    const detailView = document.getElementById('detail-view');
    const backBtn = document.getElementById('back-btn');
    const homeLink = document.getElementById('home-link');
    const relatedGridEl = document.getElementById('related-grid');

    function normalizePath(url) {
      try {
        let p = url.startsWith('http') ? new URL(url).pathname : url;
        p = p.replace(/\/+$/, '');
        if (!p.startsWith('/')) p = '/' + p;
        return p;
      } catch {
        return url;
      }
    }

    function findEntryByUrl(url) {
      if (!url) return null;
      const path = normalizePath(url);
      if (entryByPath.has(path)) return entryByPath.get(path);
      // try with/without leading /repo_posts
      for (const [k, v] of entryByPath) {
        if (path.endsWith(k) || k.endsWith(path) || path.includes(k.split('/').pop())) return v;
      }
      return allEntries.find(e => {
        const ep = normalizePath(e.postUrl || e.id || '');
        return ep === path || path.endsWith(ep) || ep.endsWith(path);
      }) || null;
    }

    // Event delegation: related clicks always work, even after re-renders
    relatedGridEl.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) return; // GitHub / archive links open normally
      const item = ev.target.closest('.related-item');
      if (!item) return;
      const href = item.dataset.href;
      if (!href) return;
      const found = findEntryByUrl(href);
      if (found) {
        ev.preventDefault();
        openDetail(found);
      } else {
        window.open(href, '_blank');
      }
    });

    const ghIcon = `<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`;

    function parseFeed(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      const ns = 'http://www.w3.org/2005/Atom';
      const entries = [...doc.getElementsByTagNameNS(ns, 'entry')];

      return entries.map(entry => {
        const get = (tag) => {
          const el = entry.getElementsByTagNameNS(ns, tag)[0];
          return el ? el.textContent.trim() : '';
        };
        const getAttr = (tag, attr, rel = null) => {
          const links = entry.getElementsByTagNameNS(ns, tag);
          for (const link of links) {
            if (rel === null || link.getAttribute('rel') === rel) {
              return link.getAttribute(attr) || '';
            }
          }
          return '';
        };

        const title = get('title');
        const postUrl = getAttr('link', 'href');
        const github = getAttr('link', 'href', 'related');
        const updated = get('updated');
        const contentEl = entry.getElementsByTagNameNS(ns, 'content')[0];
        let contentHtml = contentEl ? contentEl.textContent : '';
        let description = '';
        let image = '';

        try {
          const cdoc = parser.parseFromString(`<div>${contentHtml}</div>`, 'text/html');
          const paragraphs = cdoc.querySelectorAll('p');
          for (const p of paragraphs) {
            if (!p.querySelector('img') && p.textContent.trim()) {
              description = p.textContent.trim();
              break;
            }
          }
          if (!description && paragraphs[0]) description = paragraphs[0].textContent.trim();
          const img = cdoc.querySelector('img');
          if (img) image = img.getAttribute('src') || '';
        } catch (e) {}

        const mediaNs = 'http://search.yahoo.com/mrss/';
        const thumb = entry.getElementsByTagNameNS(mediaNs, 'thumbnail')[0];
        if (thumb && !image) image = thumb.getAttribute('url') || '';

        return { title, postUrl, github, updated, description, image, contentHtml, id: postUrl };
      });
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')}`;
    }

    function repoNameFromGithub(url) {
      if (!url) return '';
      try {
        const parts = new URL(url).pathname.split('/').filter(Boolean);
        return parts.slice(0, 2).join('/');
      } catch { return url; }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function mapUrl(postUrl) {
      try {
        const path = new URL(postUrl).pathname;
        return `${BASE}/repo_posts/map.html?hl=${encodeURIComponent(path)}`;
      } catch {
        return `${BASE}/repo_posts/map.html`;
      }
    }

    function renderCards(entries, append = false) {
      if (!append) feedEl.innerHTML = '';
      const frag = document.createDocumentFragment();

      entries.forEach(e => {
        const article = document.createElement('article');
        article.className = 'post';
        article.dataset.id = e.id;

        const dateStr = formatDate(e.updated);
        const shortGh = repoNameFromGithub(e.github);
        const mapHref = mapUrl(e.postUrl);

        article.innerHTML = `
          <span class="rec-indicator">REC ●</span>
          <p class="post-meta">${dateStr}</p>
          <div class="post-title">${escapeHtml(e.title)}</div>
          <p>${escapeHtml(e.description || 'No description available.')}</p>
          ${e.image ? `<a class="post-image-link" href="${e.postUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <img src="${e.image}" alt="${escapeHtml(e.title)} screenshot" loading="lazy" onerror="this.parentElement.style.display='none'">
          </a>` : ''}
          <div class="post-footer">
            <span class="post-cta">View details →</span>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              ${e.github ? `<a class="gh-link" href="${e.github}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ghIcon}${escapeHtml(shortGh || 'GitHub')}</a>` : ''}
              <a class="post-map-link" href="${mapHref}" target="_blank" rel="noopener" onclick="event.stopPropagation()">3D map ↗</a>
            </div>
          </div>
        `;

        article.addEventListener('click', (ev) => {
          if (ev.target.closest('a')) return;
          openDetail(e);
        });

        frag.appendChild(article);
      });

      feedEl.appendChild(frag);
    }

    function getFiltered() {
      if (!currentFilter) return allEntries;
      const q = currentFilter.toLowerCase();
      return allEntries.filter(e =>
        e.title.toLowerCase().includes(q) ||
        (e.description || '').toLowerCase().includes(q) ||
        (e.github || '').toLowerCase().includes(q)
      );
    }

    function showMore(reset = false) {
      const filtered = getFiltered();
      if (reset) {
        visibleCount = 0;
        feedEl.innerHTML = '';
      }
      const next = filtered.slice(visibleCount, visibleCount + PAGE_SIZE);
      renderCards(next, !reset);
      visibleCount += next.length;
      loadMoreBtn.style.display = visibleCount < filtered.length ? 'block' : 'none';
    }

    async function loadFeed() {
      try {
        const res = await fetch(FEED_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        allEntries = parseFeed(text);
        entryByPath = new Map();
        allEntries.forEach(e => {
          const p = normalizePath(e.postUrl || e.id || '');
          if (p) entryByPath.set(p, e);
          // also store just the filename key
          const file = p.split('/').pop();
          if (file) entryByPath.set(file, e);
        });
        entryCountEl.textContent = `${allEntries.length.toLocaleString()} entries`;
        loadingEl.style.display = 'none';
        showMore(true);
      } catch (err) {
        loadingEl.innerHTML = `<div class="error">FEED ERROR: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function openDetail(entry) {
      const myToken = ++detailToken; // invalidate any previous in-flight detail load

      feedView.classList.add('hidden');
      detailView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const titleEl = document.getElementById('detail-title');
      const metaEl = document.getElementById('detail-meta');
      const contentEl = document.getElementById('detail-content');
      const relatedGrid = document.getElementById('related-grid');

      const name = repoNameFromGithub(entry.github) || entry.title;
      titleEl.innerHTML = entry.github
        ? `<a href="${entry.github}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
        : escapeHtml(entry.title);

      metaEl.innerHTML = `
        <span class="post-meta" style="margin:0">${formatDate(entry.updated)}</span>
        ${entry.github ? `<a class="gh-link" href="${entry.github}" target="_blank" rel="noopener">${ghIcon} Open on GitHub</a>` : ''}
        <a class="post-map-link" href="${mapUrl(entry.postUrl)}" target="_blank" rel="noopener">3D map ↗</a>
        <a class="gh-link" href="${entry.postUrl}" target="_blank" rel="noopener" style="border-color:rgba(0,255,65,0.5);color:var(--eva-green)">Original post ↗</a>
      `;

      contentEl.innerHTML = entry.contentHtml || `<p>${escapeHtml(entry.description)}</p>`;

      relatedGrid.innerHTML = `<li class="loading" style="list-style:none;border:none"><div class="spinner"></div>Scanning related repositories…</li>`;

      try {
        const res = await fetch(entry.postUrl);
        if (myToken !== detailToken) return; // stale – user already navigated elsewhere
        const html = await res.text();
        if (myToken !== detailToken) return;

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const relatedCards = doc.querySelectorAll('li.related-card, .related-list li, ul.related-list > li');
        if (myToken !== detailToken) return;
        relatedGrid.innerHTML = '';

        function renderRelatedItem({ href, snippet, imgSrc, title, github }) {
          const shortGh = github ? repoNameFromGithub(github) : '';
          const displayTitle = title || snippet.slice(0, 60) || 'Related repository';
          const item = document.createElement('li');
          item.className = 'related-item';
          item.style.cursor = 'pointer';
          item.dataset.href = href || '';
          item.innerHTML = `
            ${imgSrc ? `<img class="related-preview" src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
            <div class="related-body">
              <div class="related-main">
                <div class="related-title">${escapeHtml(displayTitle)}</div>
                <div class="related-snippet">${escapeHtml(snippet || '')}</div>
              </div>
              <div class="related-meta">
                ${github ? `<a class="gh-link" href="${github}" target="_blank" rel="noopener">${ghIcon}${escapeHtml(shortGh || 'GitHub')}</a>` : ''}
                <a href="${href}" target="_blank" rel="noopener">View in archive ↗</a>
              </div>
            </div>
          `;
          relatedGrid.appendChild(item);
        }

        if (relatedCards.length) {
          relatedCards.forEach(li => {
            const link = li.querySelector('a.related-link, a[href*="/repo_posts/"]');
            const img = li.querySelector('img');
            const snippet = (li.querySelector('.related-snippet')?.textContent || link?.textContent || '').trim();
            if (!link) return;

            let href = link.getAttribute('href') || '';
            if (href.startsWith('/')) href = BASE + href;

            let imgSrc = img ? (img.getAttribute('src') || '') : '';
            if (imgSrc && imgSrc.startsWith('/')) imgSrc = BASE + imgSrc;

            const matched = allEntries.find(e =>
              e.postUrl === href ||
              e.postUrl.endsWith(href.replace(BASE, '')) ||
              href.endsWith(e.id?.replace(BASE, '') || '') ||
              (e.postUrl && href.includes(e.postUrl.split('/').pop()))
            );

            renderRelatedItem({
              href,
              snippet: snippet || matched?.description || '',
              imgSrc: imgSrc || matched?.image || '',
              title: matched?.title || '',
              github: matched?.github || ''
            });
          });
        } else {
          // Fallback: find similar repos from the feed by shared keywords
          const stop = new Set(['the','and','for','with','from','that','this','are','was','using','into','via','a','an','of','in','on','to','is','it','as','by','or','be','at','its']);
          const words = (entry.title + ' ' + (entry.description || ''))
            .toLowerCase()
            .replace(/[^a-z0-9\s]/g, ' ')
            .split(/\s+/)
            .filter(w => w.length > 3 && !stop.has(w));

          const scored = allEntries
            .filter(e => e.id !== entry.id)
            .map(e => {
              const text = (e.title + ' ' + (e.description || '')).toLowerCase();
              let score = 0;
              words.forEach(w => { if (text.includes(w)) score++; });
              return { e, score };
            })
            .filter(x => x.score >= 2)
            .sort((a, b) => b.score - a.score)
            .slice(0, 8);

          if (scored.length) {
            scored.forEach(({ e }) => {
              renderRelatedItem({
                href: e.postUrl,
                snippet: e.description || '',
                imgSrc: e.image || '',
                title: e.title,
                github: e.github || ''
              });
            });
          } else {
            // Last resort: show a few other recent entries
            allEntries
              .filter(e => e.id !== entry.id)
              .slice(0, 6)
              .forEach(e => {
                renderRelatedItem({
                  href: e.postUrl,
                  snippet: e.description || '',
                  imgSrc: e.image || '',
                  title: e.title,
                  github: e.github || ''
                });
              });
          }
        }
      } catch (err) {
        if (myToken !== detailToken) return; // stale
        // Even on fetch error, try feed-based fallback
        relatedGrid.innerHTML = '';
        allEntries
          .filter(e => e.id !== entry.id)
          .slice(0, 6)
          .forEach(e => {
            renderRelatedItem({
              href: e.postUrl,
              snippet: e.description || '',
              imgSrc: e.image || '',
              title: e.title,
              github: e.github || ''
            });
          });
      }
    }

    function closeDetail() {
      detailView.classList.remove('active');
      feedView.classList.remove('hidden');
    }

    // Events
    loadMoreBtn.addEventListener('click', () => showMore(false));
    backBtn.addEventListener('click', closeDetail);
    homeLink.addEventListener('click', (e) => {
      e.preventDefault();
      closeDetail();
      searchEl.value = '';
      currentFilter = '';
      showMore(true);
    });

    let searchTimeout;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentFilter = searchEl.value.trim();
        showMore(true);
      }, 200);
    });

    // Boot
    loadFeed();
  </script>
</body>
</html>
